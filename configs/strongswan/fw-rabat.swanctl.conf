# FW-RABAT : tunnel IPsec IKEv2 site à site vers FW-CASA
connections {
  rabat-casa {
    version = 2
    local_addrs  = 203.0.113.2
    remote_addrs = 198.51.100.2
    proposals = aes256-sha256-modp2048
    dpd_delay = 5s
    local {
      auth = psk
      id = fw-rabat.lab
    }
    remote {
      auth = psk
      id = fw-casa.lab
    }
    children {
      lan-lan {
        local_ts  = 10.20.0.0/16
        remote_ts = 10.10.0.0/16
        esp_proposals = aes256-sha256-modp2048
        start_action = trap
        dpd_action = restart
      }
    }
  }
}
# La clé pré-partagée n'est jamais dans le dépôt : lab.sh la génère à chaque démarrage.
include psk.conf
