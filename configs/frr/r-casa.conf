! R-CASA : routeur de bord, site Casablanca
! OSPF aire 0, authentification MD5, timers rapides pour une reconvergence en quelques secondes.
hostname r-casa
!
interface eth0
 description backbone vers R-ISP
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 LabOspfKey
!
interface eth2
 description lien de secours direct vers R-RABAT
 ip ospf network point-to-point
 ip ospf cost 100
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 LabOspfKey
!
router ospf
 ospf router-id 1.1.1.1
 passive-interface eth1
 passive-interface lo
 network 10.255.0.0/30 area 0
 network 10.255.0.8/30 area 0
 network 198.51.100.0/30 area 0
 network 1.1.1.1/32 area 0
!
