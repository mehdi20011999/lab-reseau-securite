! R-RABAT : routeur de bord, site Rabat
hostname r-rabat
!
interface eth0
 description backbone vers R-ISP
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 LabOspfKey
!
interface eth2
 description lien de secours direct vers R-CASA
 ip ospf network point-to-point
 ip ospf cost 100
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 LabOspfKey
!
router ospf
 ospf router-id 3.3.3.3
 passive-interface eth1
 passive-interface lo
 network 10.255.0.4/30 area 0
 network 10.255.0.8/30 area 0
 network 203.0.113.0/30 area 0
 network 3.3.3.3/32 area 0
!
