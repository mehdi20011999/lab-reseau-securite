! R-ISP : coeur du backbone, simule Internet (8.8.8.8 en loopback)
hostname r-isp
!
interface eth0
 description backbone vers R-CASA
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 LabOspfKey
!
interface eth1
 description backbone vers R-RABAT
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 LabOspfKey
!
router ospf
 ospf router-id 2.2.2.2
 passive-interface lo
 network 10.255.0.0/30 area 0
 network 10.255.0.4/30 area 0
 network 2.2.2.2/32 area 0
 network 8.8.8.8/32 area 0
!
