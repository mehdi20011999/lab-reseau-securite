name: Labo réseau

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Installer FRRouting, strongSwan, nftables
        run: sudo ./scripts/install.sh

      - name: Démarrer le labo (11 équipements)
        run: sudo ./lab.sh up

      - name: Lancer les tests
        run: sudo ./lab.sh test

      - name: Résultats dans le résumé du job
        if: always()
        run: cat results/RESULTS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publier captures et résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preuves-labo
          path: |
            results/
            captures/
            /tmp/netlab/**/*.log

      - name: Arrêter le labo
        if: always()
        run: sudo ./lab.sh down
